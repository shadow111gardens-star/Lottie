<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">A small interface control with a check mark and subtle motion rings</title><desc id="desc">Use small interface animations to confirm actions, explain state changes, and reduce uncertainty without adding distracting motion.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0eaff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7655ed"/><stop offset="1" stop-color="#bda9ff"/></linearGradient><linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff91cf"/><stop offset="1" stop-color="#ffd4ed"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#382078" flood-opacity=".15"/></filter></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><circle cx="112" cy="80" r="4" fill="#7655ed" opacity=".45"/><circle cx="1115" cy="531" r="6" fill="#ff91cf" opacity=".72"/><path d="M0 542C173 481 268 563 398 525" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/><g font-family="Inter,Arial,sans-serif"><text x="86" y="113" font-size="17" font-weight="700" letter-spacing="4" fill="#7655ed">VEKTO · MOTION NOTES</text><text x="86" y="251" font-size="43" font-weight="800" fill="#17152a">Microinteractions</text><text x="86" y="310" font-size="32" font-weight="650" fill="#7663a8">Small Motion That Makes Interfaces Easier to Read</text><text x="86" y="526" font-size="17" font-weight="600" letter-spacing="2" fill="#8f86a7">DESIGN · SVG · PRODUCT ANIMATION</text></g><g filter="url(#shadow)"><rect x="717" y="150" width="357" height="336" rx="28" fill="#fff"/><rect x="753" y="190" width="284" height="14" rx="7" fill="#e5def8"/><rect x="753" y="230" width="284" height="150" rx="22" fill="url(#pink)"/><path d="M780 347L840 292L890 324L954 258L1014 347" fill="#fff" opacity=".78"/><path d="M696 450C790 409 870 476 955 428S1071 423 1110 382" fill="none" stroke="#7251ed" stroke-width="8" stroke-linecap="round"/><circle cx="1110" cy="382" r="14" fill="#ff79c9"/></g></svg>